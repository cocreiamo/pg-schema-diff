name: release
# Stripe non pubblica binari: il fork li compila e li allega alla Release,
# così mise li installa con `ubi:cocreiamo/pg-schema-diff` — cocreiamo-platform ADR 0008.
on:
  push:
    tags:
      - "v*-rogita.*"
permissions:
  contents: write
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/pg-schema-diff_${VERSION}_${os}_${arch}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${out}/pg-schema-diff" ./cmd/pg-schema-diff
            tar -C "${out}" -czf "${out}.tar.gz" pg-schema-diff
          done
          (cd dist && sha256sum ./*.tar.gz > checksums.txt)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/*.tar.gz dist/checksums.txt --generate-notes --title "$VERSION"
