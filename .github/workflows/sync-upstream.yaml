name: sync-upstream
# Trunk-based fork: `main` carries our fixes on top of stripe/pg-schema-diff `main`,
# which is mirrored to `upstream-main`. The weekly rebase drops by itself what upstream
# has merged; on a conflict it opens an issue instead of pushing.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false
      - name: Mirror upstream and rebase main
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git config user.name "cocreiamo-sync[bot]"
          git config user.email "sync@cocreiamo.com"
          git remote add upstream https://github.com/stripe/pg-schema-diff.git
          git fetch upstream main
          git push "$ORIGIN" upstream/main:refs/heads/upstream-main
          if git rebase upstream/main; then
            git push --force-with-lease "$ORIGIN" HEAD:main
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git rebase --abort
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an issue on conflict
        if: steps.sync.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Rebase of main on upstream/main has conflicts" \
            --body "The weekly sync could not rebase main on upstream/main. Resolve it by hand: the conflicting fixes were probably merged upstream in a different form." \
            --label sync
